# Render Blueprint for the MesmerApp backend (NestJS + Prisma).
# Secrets marked `sync: false` are entered in the Render dashboard.
services:
  - type: web
    name: mesmerapp-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    # Applies any pending migrations to Supabase before starting.
    startCommand: npx prisma migrate deploy && node dist/src/main.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_PROJECT_URL
        value: https://cbmhzdvwrvnyivrntfbt.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
